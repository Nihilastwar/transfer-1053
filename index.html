<style>
:root{
  --ink:#444444; --ink-soft:#6E6E6E; --ink-faint:#9A9A9A;
  --bg:#ECECEC; --paper:#F6F6F6; --line:#D4D4D4; --err:#B3261E; --ok:#2E7D4F;
  --gold:#D4A62A; --purple:#7A4FC4; --blue:#2F6BD1; --white:#FFFFFF;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Poppins,system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:6px}

/* ---------- progress + raccoon ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:5;padding:calc(env(safe-area-inset-top) + 0px) 0 0;background:var(--bg)}
.track{display:flex;gap:4px;padding:10px 12px 0}
.seg{flex:1;height:8px;border-radius:4px;background:var(--line);transition:background .35s}
.seg.done{background:var(--ink)}
.seg.cur{background:var(--ink-faint)}
.lane{position:relative;height:44px;margin:0 12px}
.coon{position:absolute;top:4px;left:calc((100% - 60px - 32px) * var(--p));width:60px;height:33px;transition:left .7s cubic-bezier(.3,.7,.3,1);transform:scaleY(-1)}
.coon svg{display:block;width:60px;height:33px;image-rendering:pixelated}
.heart{position:absolute;top:39px;left:calc((100% - 60px - 32px) * var(--p) + 37px);width:16px;height:14px;opacity:0;transform:scale(.2);transition:left .7s cubic-bezier(.3,.7,.3,1),opacity .25s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.heart.on{opacity:1;transform:scale(1);transition-delay:0s,.85s,.85s}
.heart.on svg{animation:bob 1.1s 1.2s ease-in-out infinite}
.heart svg{display:block;width:16px;height:14px;transform:scaleY(-1)}
@keyframes bob{0%,100%{transform:scaleY(-1) translateY(0)}50%{transform:scaleY(-1) translateY(-3px)}}
.coon .fB{opacity:0}
.coon.run .fA{animation:fa .16s steps(1) infinite}
.coon.run .fB{animation:fb .16s steps(1) infinite}
@keyframes fa{0%{opacity:1}50%{opacity:0}}
@keyframes fb{0%{opacity:0}50%{opacity:1}}
.sausage{position:absolute;right:0;top:14px;width:32px;height:13px;transition:transform .3s,opacity .3s}
.sausage.gone{transform:scale(.2);opacity:0}
.nom{position:absolute;right:2px;top:12px;font-weight:800;font-size:12px;opacity:0;transition:opacity .3s}
.nom.on{opacity:1}

/* ---------- form screens ---------- */
main{min-height:100%;display:flex;align-items:center;justify-content:center;padding:118px 22px 110px}
.step{width:100%;max-width:560px;animation:in .38s cubic-bezier(.2,.7,.2,1)}
.step.back{animation:inb .38s cubic-bezier(.2,.7,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes inb{from{opacity:0;transform:translateY(-26px)}to{opacity:1;transform:none}}
.num{font-size:14px;font-weight:600;color:var(--ink-soft);margin-bottom:10px}
h1{font-size:clamp(26px,6.4vw,36px);line-height:1.18;font-weight:700;letter-spacing:-.01em}
.hint{margin-top:10px;font-size:15px;color:var(--ink-soft);line-height:1.45}
.field{margin-top:28px;position:relative}
.inp{width:100%;border:0;border-bottom:2px solid var(--line);background:transparent;padding:6px 0 10px;font-size:26px;font-weight:600;outline:none;border-radius:0;transition:border-color .2s}
.inp::placeholder{color:var(--ink-faint);font-weight:500}
.inp:focus{border-bottom-color:var(--ink)}
.inp.has-suffix{padding-right:46px}
.suffix{position:absolute;right:2px;bottom:12px;font-size:22px;font-weight:700;color:var(--ink-soft)}
textarea.inp{font-size:19px;font-weight:500;resize:none;min-height:120px;line-height:1.45}
.preview{margin-top:10px;font-size:15px;font-weight:600;color:var(--ink-soft);min-height:22px}
.err{margin-top:12px;font-size:15px;font-weight:600;color:var(--err);min-height:22px}
.actions{margin-top:22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.btn{background:var(--ink);color:#fff;border:0;border-radius:12px;padding:14px 26px;font-size:17px;font-weight:700;cursor:pointer;transition:transform .12s,background .2s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.55;cursor:default}
.link{background:none;border:0;font-weight:600;font-size:15px;color:var(--ink-soft);cursor:pointer;padding:6px 2px;text-decoration:underline;text-underline-offset:3px}
.enter{font-size:13px;color:var(--ink-faint)}
@media (hover:none){.enter{display:none}}

.backbtn{position:fixed;left:16px;bottom:calc(18px + env(safe-area-inset-bottom));height:46px;padding:0 16px 0 12px;gap:6px;font-weight:700;font-size:15px;border-radius:12px;border:2px solid var(--line);background:var(--paper);cursor:pointer;display:flex;align-items:center;justify-content:center}
.backbtn svg{width:20px;height:20px}

/* language + choices */
.langs{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:14px 14px;font-size:16px;font-weight:600;cursor:pointer;transition:border-color .15s,transform .12s}
.opt:active{transform:scale(.98)}
.opt.sel{border-color:var(--ink);background:#fff}
.seats{margin-top:26px;display:grid;gap:10px}
.sw{width:26px;height:26px;border-radius:7px;flex:none;border:2px solid rgba(0,0,0,.12)}
.sw.gold{background:var(--gold)}.sw.purple{background:var(--purple)}.sw.blue{background:var(--blue)}.sw.white{background:var(--white);border-color:var(--line)}

/* slider */
.conf{margin-top:34px}
.conf-label{font-size:24px;font-weight:700;min-height:36px}
.conf-label.unset{color:var(--ink-faint);font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin-top:12px;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:var(--line)}
input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--ink);margin-top:-11px;border:4px solid var(--bg)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--ink);border:4px solid var(--bg)}
input[type=range].unset::-webkit-slider-thumb{background:var(--ink-faint)}
input[type=range].unset::-moz-range-thumb{background:var(--ink-faint)}
.ticks{display:flex;justify-content:space-between;padding:0 6px;font-size:14px;font-weight:700;color:var(--ink-soft)}

.done h1{font-size:clamp(30px,8vw,44px)}
.done .note{margin-top:28px;font-size:14px}

/* ---------- board ---------- */
.board{max-width:760px;margin:0 auto;padding:20px 16px 60px}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bhead h1{font-size:24px}
.bsub{font-size:14px;color:var(--ink-soft);font-weight:500;margin-top:2px}
.bbtns{display:flex;gap:8px}
.bbtn{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer}
.bbtn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.totals{margin-top:18px;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:14px 16px}
.totals h2{font-size:15px;font-weight:700;margin-bottom:8px}
.trow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.trow:first-of-type{border-top:0}
.trow b{font-weight:700;white-space:nowrap}
.trow span{display:flex;align-items:center;gap:8px}
.trow .sw{width:16px;height:16px;border-radius:4px}
.tgrid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:620px){.tgrid{grid-template-columns:1fr 1fr}}
.group{margin-top:26px}
.ghead{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700}
.ghead small{font-size:14px;color:var(--ink-soft);font-weight:500}
.card{margin-top:10px;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:14px 16px}
.card.dupe{opacity:.55}
.ctop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cname{font-size:18px;font-weight:700;word-break:break-word}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.badge{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--line)}
.badge.warm{background:#D9EFE1;color:var(--ok)}
.badge.dup{background:#F5D9D7;color:var(--err)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat small{display:block;font-size:12px;color:var(--ink-soft);font-weight:500}
.stat b{font-size:16px;font-weight:700}
.comment{margin-top:10px;font-size:14px;line-height:1.45;color:var(--ink-soft);white-space:pre-wrap;word-break:break-word}
.applied{flex:none;display:flex;align-items:center;gap:8px;background:transparent;border:2px solid var(--line);border-radius:10px;padding:7px 10px;font-weight:700;font-size:13px;cursor:pointer}
.applied .box{width:18px;height:18px;border-radius:5px;border:2px solid var(--ink-soft);display:flex;align-items:center;justify-content:center}
.applied.on{border-color:var(--ok);color:var(--ok)}
.applied.on .box{background:var(--ok);border-color:var(--ok)}
.applied.on .box::after{content:"";width:8px;height:4px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.empty{margin-top:30px;color:var(--ink-soft);font-weight:500}
.login{max-width:400px;margin:0 auto;padding:110px 22px}
.login .inp{font-size:19px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;z-index:20;max-width:90vw}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ---------------------------- parsing ---------------------------- */
// Power in millions. Accepts 231.5 / 231,5 / 231.5M / 231500000 / 231,500,000 / 231.500.000
function parseMil(raw){
  let s = String(raw||"").trim().replace(/\s+/g,"").replace(/[mм]$/i,"");
  if (!s) return null;
  if (!/^[0-9.,]+$/.test(s)) return NaN;
  const seps = (s.match(/[.,]/g)||[]).length;
  const digits = s.replace(/[.,]/g,"");
  if (!digits) return NaN;
  let v;
  if (seps > 1) v = Number(digits) / 1e6;
  else if (seps === 1) { v = Number(s.replace(",", ".")); if (v >= 90000) v = v / 1e6; }
  else { v = Number(digits); if (v >= 90000) v = v / 1e6; }
  if (!isFinite(v)) return NaN;
  return Math.round(v * 10) / 10;
}
function parseInt0(raw, max){
  const s = String(raw||"").trim();
  if (!s) return null;
  if (!/^[0-9.,\s]+$/.test(s)) return NaN;
  const n = Number(s.replace(/[^0-9]/g,""));
  if (!isFinite(n) || n > max) return NaN;
  return n;
}
const fmt = (n, loc="en-US", d=0) => Number(n).toLocaleString(loc,{minimumFractionDigits:d,maximumFractionDigits:d});

function validate(st){
  const L = T[S.lang], a = S.a;
  if (st.id === "nickname") return a.nickname.trim() ? null : L.e.req;
  if (st.id === "server") { const n = parseInt0(a.server, 99999); if (n === null) return null; return (isNaN(n) || n < 1) ? L.e.num : null; }
  if (st.id === "seat") return a.seat ? null : L.e.req;
  if (st.id === "total") { const n = parseMil(a.total); if (n === null) return L.e.req; if (isNaN(n)) return L.e.num; return (n < 80 || n > 600) ? L.e.range : null; }
  if (st.id === "squad") {
    const n = parseMil(a.squad); if (n === null) return L.e.req; if (isNaN(n) || n <= 0) return L.e.num;
    const t = parseMil(a.total); return (t != null && !isNaN(t) && n > t) ? L.e.squadMax : null;
  }
  if (st.id === "kills") { const n = parseInt0(a.kills, 1e12); if (n === null) return L.e.req; return isNaN(n) ? L.e.num : null; }
  if (st.id === "conf") return a.conf == null ? L.e.req : null;
  if (st.id === "beef") return (a.beef === "explain" && !a.beefNote.trim()) ? L.e.beefEmpty : null;
  return null;
}
function next(){
  if (S.sending) return;
  const st = STEPS[S.i], err = validate(st);
  if (err) { document.getElementById("er").textContent = err; return; }
  if (S.i === STEPS.length - 1) submit(); else go(S.i + 1, 1);
}
function go(i, dir){
  if (i < -1) return;
  S.i = i; S.dir = dir; render();
  window.scrollTo(0, 0);
}

/* ---------------------------- submit ---------------------------- */
function buildData(){
  const a = S.a;
  return {
    nickname: a.nickname.trim().slice(0, 40),
    server: parseInt0(a.server, 99999),
    seat: a.seat,
    totalPower: parseMil(a.total),
    squadPower: parseMil(a.squad),
    kills: parseInt0(a.kills, 1e12),
    confidence: a.conf,
    beef: a.beef,
    beefNote: a.beef === "explain" ? a.beefNote.trim().slice(0, 1000) : "",
    comment: a.comment.trim().slice(0, 1000),
    applied: false
  };
}
function saveDraft(id, data){ try { localStorage.setItem(DRAFT_KEY, JSON.stringify({id, data})); } catch(_){} }
function clearDraft(){ try { localStorage.removeItem(DRAFT_KEY); } catch(_){} }

async function submit(){
  const L = T[S.lang];
  const ok = document.getElementById("ok"), er = document.getElementById("er");
  if (!CONFIGURED) { er.textContent = "Setup not finished: Firebase config missing."; return; }
  // re-check every step before sending
  for (let k = 0; k < STEPS.length; k++) { const e = validate(STEPS[k]); if (e) { go(k, -1); setTimeout(() => { const x = document.getElementById("er"); if (x) x.textContent = e; }, 0); return; } }

  S.sending = true; ok.disabled = true; ok.textContent = L.sending; er.textContent = "";
  if (!S.pending) {
    const data = buildData();
    if (!S.docId) S.docId = doc(collection(db, COL)).id;
    saveDraft(S.docId, data);
    S.pending = setDoc(doc(db, COL, S.docId), {...data, createdAt: serverTimestamp()});
  }
  const weakTimer = setTimeout(() => { if (S.sending) { er.style.color = "var(--ink-soft)"; er.textContent = L.weak; } }, 8000);
  try {
    await S.pending;
    clearTimeout(weakTimer); clearDraft();
    S.sending = false; S.pending = null;
    go(STEPS.length, 1);
  } catch (e) {
    clearTimeout(weakTimer);
    S.sending = false; S.pending = null;
    console.error(e);
    er.style.color = ""; er.textContent = L.fail + (e && e.code ? ` (${e.code})` : "");
    ok.disabled = false; ok.textContent = L.retry;
  }
}

// If a previous visit closed before the save was confirmed, resend it quietly with the same id.
async function flushDraft(){
  if (!CONFIGURED) return;
  let d = null; try { d = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null"); } catch(_){}
  if (!d || !d.id || !d.data) return;
  try { await setDoc(doc(db, COL, d.id), {...d.data, createdAt: serverTimestamp()}); clearDraft(); }
  catch (e) { if (e && e.code === "permission-denied") clearDraft(); /* already saved earlier: rules block overwrites */ }
}

function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
const keyOf = n => String(n||"").trim().toLowerCase().replace(/\s+/g," ");
const ms = r => r.createdAt && r.createdAt.toMillis ? r.createdAt.toMillis() : 0;
const isWarm = r => r.confidence === 4 || r.confidence === 5;

function analyse(list){
  // newest entry per nickname counts; older ones are marked duplicate
  const newest = new Map();
  list.forEach(r => { const k = keyOf(r.nickname); const cur = newest.get(k); if (!cur || ms(r) > ms(cur)) newest.set(k, r); });
  const out = list.map(r => ({...r, dupe: newest.get(keyOf(r.nickname)).id !== r.id}));
  const sorter = (a, b) => (b.confidence||0) - (a.confidence||0) || (b.squadPower||0) - (a.squadPower||0) || ms(b) - ms(a);
  const groups = SEATS.map(s => ({seat:s, items: out.filter(r => r.seat === s).sort((a,b) => (a.dupe - b.dupe) || sorter(a,b))}));
  const live = out.filter(r => !r.dupe);
  const sum = arr => Math.round(arr.reduce((t, r) => t + (r.totalPower||0), 0) * 10) / 10;
  const warm = live.filter(isWarm), cold = live.filter(r => !isWarm(r));
  const totals = {
    all:{n:live.length, p:sum(live)},
    warm:{n:warm.length, p:sum(warm)},
    cold:{n:cold.length, p:sum(cold)},
    seat:Object.fromEntries(SEATS.map(s => { const a = live.filter(r => r.seat === s); return [s, {n:a.length, p:sum(a)}]; }))
  };
  return {groups, totals, dupes: out.length - live.length};
}

function boardLogin(msg){
  $top.innerHTML = ""; $top.className = "";
  $app.innerHTML = `<div class="login"><h1>Transfer board</h1><p class="hint">Leaders only.</p>
    <input class="inp" id="em" type="email" autocomplete="username" placeholder="Login email">
    <input class="inp" id="pw" type="password" autocomplete="current-password" placeholder="Password">
    <div class="err" id="er">${esc(msg||"")}</div>
    <div class="actions"><button class="btn" id="li">Log in</button></div></div>`;
  const doLogin = async () => {
    const b = document.getElementById("li"); b.disabled = true;
    try { await signInWithEmailAndPassword(auth, document.getElementById("em").value.trim(), document.getElementById("pw").value); }
    catch (e) { document.getElementById("er").textContent = "Login failed. Check email and password."; b.disabled = false; }
  };
  document.getElementById("li").onclick = doLogin;
  document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
}

function renderBoard(){
  const {groups, totals, dupes} = analyse(rows);
  const P = n => fmt(n, "en-US", 1) + "M";
  const pl = n => `${n} player${n===1?"":"s"}`;
  const tr = (label, t, sw) => `<div class="trow"><span>${sw ? `<span class="sw ${sw}"></span>` : ""}${label}</span><b>${pl(t.n)}, ${P(t.p)}</b></div>`;
  $app.innerHTML = `<div class="board">
    <div class="bhead"><div><h1>Transfer board</h1><div class="bsub">${rows.length} application${rows.length===1?"":"s"}${dupes ? `, ${dupes} duplicate${dupes>1?"s":""} (not counted)` : ""}</div></div>
      <div class="bbtns"><button class="bbtn" id="csv">Export CSV</button><button class="bbtn ghost" id="lo">Log out</button></div></div>
    <div class="tgrid">
      <div class="totals"><h2>Power by confidence</h2>${tr("Confident (4–5)", totals.warm)}${tr("Hesitating (1–3)", totals.cold)}${tr("All", totals.all)}</div>
      <div class="totals"><h2>Power by seat</h2>${SEATS.map(s => tr(SEAT_EN[s], totals.seat[s], s)).join("")}</div>
    </div>
    ${rows.length === 0 ? `<p class="empty">No applications yet. Share the form link to get the first ones in.</p>` : ""}
    ${groups.filter(g => g.items.length).map(g => `<section class="group">
      <div class="ghead"><span class="sw ${g.seat}"></span>${SEAT_EN[g.seat]} <small>${pl(g.items.filter(r=>!r.dupe).length)}</small></div>
      ${g.items.map(r => `<div class="card ${r.dupe?"dupe":""}">
        <div class="ctop"><div><div class="cname">${esc(r.nickname)}</div>
          <div class="badges">
            ${r.server != null ? `<span class="badge">Server ${esc(r.server)}</span>` : ""}
            <span class="badge ${isWarm(r)?"warm":""}">${r.confidence ? `${r.confidence}/5 ${esc(CONF_EN[r.confidence-1])}` : "Confidence skipped"}</span>
            ${r.beef ? `<span class="badge ${r.beef==="explain"?"dup":""}">${BEEF_EN[r.beef]}</span>` : ""}
            ${r.dupe ? `<span class="badge dup">Duplicate, older entry</span>` : ""}
          </div></div>
          <button class="applied ${r.applied?"on":""}" data-id="${esc(r.id)}" data-v="${r.applied?1:0}" aria-pressed="${r.applied?"true":"false"}"><span class="box"></span>Applied</button>
        </div>
        <div class="stats">
          <div class="stat"><small>Total power</small><b>${r.totalPower != null ? P(r.totalPower) : "–"}</b></div>
          <div class="stat"><small>1st squad</small><b>${r.squadPower != null ? P(r.squadPower) : "–"}</b></div>
          <div class="stat"><small>Kills</small><b>${r.kills != null ? fmt(r.kills) : "–"}</b></div>
        </div>
        ${r.beefNote ? `<div class="comment"><b>Beef:</b> ${esc(r.beefNote)}</div>` : ""}
        ${r.comment ? `<div class="comment">${esc(r.comment)}</div>` : ""}
      </div>`).join("")}
    </section>`).join("")}
  </div>`;
  document.getElementById("lo").onclick = () => signOut(auth);
  document.getElementById("csv").onclick = exportCsv;
  $app.querySelectorAll(".applied").forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await updateDoc(doc(db, COL, b.dataset.id), {applied: b.dataset.v !== "1"}); }
    catch (e) { console.error(e); toast("Couldn't save the tick. Check your connection and try again."); b.disabled = false; }
  });
}

function csvCell(v){ const s = v == null ? "" : String(v); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; }
async function exportCsv(){
  const {groups, totals} = analyse(rows);
  const now = new Date();
  const stamp = now.toISOString().slice(0,16).replace("T"," ");
  const L = [];
  L.push(["Transfer to 1053 export", stamp]);
  L.push([]);
  L.push(["Totals (duplicates not counted)","Players","Total hero power (M)"]);
  L.push(["Confident (4-5)", totals.warm.n, totals.warm.p]);
  L.push(["Hesitating (1-3)", totals.cold.n, totals.cold.p]);
  SEATS.forEach(s => L.push([SEAT_EN[s] + " seats", totals.seat[s].n, totals.seat[s].p]));
  L.push(["All", totals.all.n, totals.all.p]);
  L.push([]);
  L.push(["Nickname","Server","Seat","Total hero power (M)","1st squad power (M)","Kills","Confidence (1-5)","Confident or hesitating","Applied","Duplicate","Beef","Beef details","Comment","Submitted (UTC)"]);
  groups.forEach(g => g.items.forEach(r => L.push([
    r.nickname, r.server ?? "", SEAT_EN[r.seat], r.totalPower ?? "", r.squadPower ?? "", r.kills ?? "",
    r.confidence ?? "", isWarm(r) ? "Confident" : "Hesitating", r.applied ? "Yes" : "No", r.dupe ? "Yes" : "No",
    r.beef ? BEEF_EN[r.beef] : "", r.beefNote || "", r.comment || "", ms(r) ? new Date(ms(r)).toISOString().slice(0,16).replace("T"," ") : ""
  ])));
  const text = "\uFEFF" + L.map(r => r.map(csvCell).join(",")).join("\r\n");
  const name = `transfer-1053-${now.toISOString().slice(0,10)}.csv`;
  const file = new File([text], name, {type:"text/csv"});
  try {
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:name}); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const url = URL.createObjectURL(file);
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function startBoard(){
  document.title = "Transfer board";
  if (!CONFIGURED) { $app.innerHTML = `<div class="login"><h1>Setup not finished</h1><p class="hint">Paste the Firebase config into index.html first.</p></div>`; return; }
  onAuthStateChanged(auth, user => {
    if (unsub) { unsub(); unsub = null; }
    if (!user) { boardLogin(); return; }
    $app.innerHTML = `<div class="board"><p class="empty">Loading…</p></div>`;
    unsub = onSnapshot(collection(db, COL),
      snap => { rows = snap.docs.map(d => ({id:d.id, ...d.data()})); renderBoard(); },
      err => { console.error(err); if (err.code === "permission-denied") { signOut(auth); boardLogin("This login has no access to the board."); } else toast("Connection issue. Data will refresh when you're back online."); });
  });
}

/* ---------------------------- boot ---------------------------- */
if (location.hash === "#board") startBoard();
else { render(); flushDraft(); }
window.addEventListener("hashchange", () => location.reload());
