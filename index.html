/* ================================ LOOK ================================ */
:root{
  --ink:#333333; --ink-soft:#5F6670; --ink-faint:#98A0AA;
  --bg:#EEF1F5; --paper:#F8FAFC; --card:#FFFFFF; --line:#D5DBE3;
  --err:#B3261E; --ok:#23784A; --okbg:#DCEFE3; --errbg:#F6DEDC;
  --gold:#D4A62A; --purple:#7A4FC4; --blue:#2F6BD1; --white:#FFFFFF;
  --ease:cubic-bezier(.2,.75,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:8px}

/* ---------- top: progress + raccoon + back ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top)}
.track{display:flex;gap:4px;padding:12px 14px 0}
.seg{flex:1;height:7px;border-radius:4px;background:var(--line);transition:background .35s}
.seg.done{background:var(--ink)}
.seg.cur{background:var(--ink-faint)}
.lane{position:relative;height:42px;margin:0 14px}
.coon{position:absolute;top:4px;left:calc((100% - 60px - 32px) * var(--p));width:60px;height:33px;transition:left .7s var(--ease);transform:scaleY(-1)}
.coon svg{display:block;width:60px;height:33px}
.coon .fB{opacity:0}
.coon.run .fA{animation:fa .16s steps(1) infinite}
.coon.run .fB{animation:fb .16s steps(1) infinite}
@keyframes fa{0%{opacity:1}50%{opacity:0}}
@keyframes fb{0%{opacity:0}50%{opacity:1}}
.heart{position:absolute;top:39px;left:calc((100% - 60px - 32px) * var(--p) + 37px);width:16px;height:14px;opacity:0;transform:scale(.2);transition:left .7s var(--ease),opacity .25s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.heart.on{opacity:1;transform:scale(1);transition-delay:0s,.85s,.85s}
.heart svg{display:block;width:16px;height:14px;transform:scaleY(-1)}
.heart.on svg{animation:bob 1.1s 1.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:scaleY(-1) translateY(0)}50%{transform:scaleY(-1) translateY(-3px)}}
.sausage{position:absolute;right:0;top:14px;width:32px;height:13px;transition:transform .3s,opacity .3s}
.sausage.gone{transform:scale(.2);opacity:0}
.nom{position:absolute;right:2px;top:12px;font-weight:800;font-size:12px;opacity:0;transition:opacity .3s}
.nom.on{opacity:1}
.backrow{height:44px;padding:4px 14px 0}
.backbtn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px 0 10px;border-radius:10px;border:2px solid var(--line);background:var(--paper);font-weight:700;font-size:14px;transition:transform .12s var(--ease),border-color .2s}
.backbtn:active{transform:scale(.95)}
.backbtn svg{width:18px;height:18px}

/* ---------- form screens ---------- */
main{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:150px 22px 64px}
.step{width:100%;max-width:560px}
.step.in{animation:in .42s var(--ease)}
.step.inb{animation:inb .42s var(--ease)}
.step.out{animation:out .16s ease-in forwards}
.step.outb{animation:outb .16s ease-in forwards}
@keyframes in{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes inb{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateY(-18px)}}
@keyframes outb{to{opacity:0;transform:translateY(18px)}}
.num{font-size:14px;font-weight:700;color:var(--ink-soft);margin-bottom:10px}
h1{font-size:clamp(27px,6.8vw,38px);line-height:1.14;font-weight:800;letter-spacing:-.025em}
h2.sub{font-size:19px;font-weight:800;letter-spacing:-.015em;margin-top:26px}
.hint{margin-top:10px;font-size:15px;color:var(--ink-soft);line-height:1.45;font-weight:500}
.field{margin-top:24px;position:relative}
.inp{width:100%;border:0;border-bottom:2px solid var(--line);background:transparent;padding:6px 0 10px;font-size:26px;font-weight:700;letter-spacing:-.01em;outline:none;border-radius:0;transition:border-color .25s}
.inp::placeholder{color:var(--ink-faint);font-weight:600}
.inp:focus{border-bottom-color:var(--ink)}
.inp.small{font-size:20px}
.inp.has-suffix{padding-right:46px}
.suffix{position:absolute;right:2px;bottom:12px;font-size:22px;font-weight:800;color:var(--ink-soft)}
textarea.inp{font-size:19px;font-weight:600;resize:none;min-height:110px;line-height:1.45}
.preview{margin-top:10px;font-size:15px;font-weight:700;color:var(--ink-soft);min-height:22px}
.err{margin-top:12px;font-size:15px;font-weight:700;color:var(--err);min-height:22px}
.err.info{color:var(--ink-soft)}
.shake{animation:shake .38s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.actions{margin-top:20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.btn{background:var(--ink);color:#fff;border:0;border-radius:12px;padding:15px 28px;font-size:17px;font-weight:800;transition:transform .12s var(--ease),opacity .2s}
.btn:active{transform:scale(.95)}
.btn[disabled]{opacity:.55;cursor:default}
.link{background:none;border:0;font-weight:700;font-size:15px;color:var(--ink-soft);padding:6px 2px;text-decoration:underline;text-underline-offset:3px}
.enter{font-size:13px;color:var(--ink-faint);font-weight:600}
@media (hover:none){.enter{display:none}}

.langs{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{margin-top:24px;display:grid;gap:10px}
.opt{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:14px 44px 14px 16px;font-size:16px;font-weight:700;transition:border-color .15s,transform .12s var(--ease),background .15s}
.opt:active{transform:scale(.98)}
.opt.sel{border-color:var(--ink);background:var(--card)}
.opt .tick{position:absolute;right:16px;top:50%;width:18px;height:18px;margin-top:-9px;opacity:0;transform:scale(.4);transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.opt.sel .tick{opacity:1;transform:scale(1)}
.opt.blink{animation:blink .34s steps(1) 2}
@keyframes blink{0%{background:var(--ink);color:#fff;border-color:var(--ink)}50%{background:var(--card);color:var(--ink)}}
.sw{width:24px;height:24px;border-radius:7px;flex:none;border:2px solid rgba(0,0,0,.1)}
.sw.gold{background:var(--gold)}.sw.purple{background:var(--purple)}.sw.blue{background:var(--blue)}.sw.white{background:var(--white);border-color:var(--line)}

.conf{margin-top:30px}
.conf-label{font-size:24px;font-weight:800;letter-spacing:-.015em;min-height:34px}
.conf-label.small{font-size:19px;min-height:28px}
.conf-label.unset{color:var(--ink-faint);font-weight:700}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin-top:10px}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:var(--line)}
input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--ink);margin-top:-11px;border:4px solid var(--bg);transition:transform .15s}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--ink);border:4px solid var(--bg)}
input[type=range].unset::-webkit-slider-thumb{background:var(--ink-faint)}
input[type=range].unset::-moz-range-thumb{background:var(--ink-faint)}
.ticks{display:flex;justify-content:space-between;padding:0 6px;font-size:14px;font-weight:800;color:var(--ink-soft)}

.done h1{font-size:clamp(32px,8.5vw,46px)}
.done .note{margin-top:30px;font-size:14px;font-weight:700}

/* ---------- board ---------- */
.board{max-width:780px;margin:0 auto;padding:22px 16px 60px}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bhead h1{font-size:26px}
.bsub{font-size:14px;color:var(--ink-soft);font-weight:600;margin-top:2px}
.bbtns{display:flex;gap:8px}
.bbtn{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:800;font-size:14px}
.bbtn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.tgrid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:18px}
@media(min-width:620px){.tgrid{grid-template-columns:1fr 1fr}}
.totals{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:14px 16px}
.totals h2{font-size:15px;font-weight:800;margin-bottom:6px}
.trow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px;font-weight:600}
.trow:first-of-type{border-top:0}
.trow b{font-weight:800;white-space:nowrap}
.trow span{display:flex;align-items:center;gap:8px;min-width:0;word-break:break-word}
.trow .sw{width:16px;height:16px;border-radius:4px}
.crews{margin-top:12px}
.crews .trow b{white-space:normal;text-align:right}
.group{margin-top:26px}
.ghead{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800}
.ghead small{font-size:14px;color:var(--ink-soft);font-weight:600}
.card{margin-top:10px;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:14px 16px}
.card.dupe{opacity:.55}
.ctop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cname{font-size:18px;font-weight:800;word-break:break-word}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.badge{font-size:12px;font-weight:800;padding:3px 8px;border-radius:6px;background:var(--line);word-break:break-word}
.badge.warm{background:var(--okbg);color:var(--ok)}
.badge.red{background:var(--errbg);color:var(--err)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat small{display:block;font-size:12px;color:var(--ink-soft);font-weight:600}
.stat b{font-size:16px;font-weight:800}
.comment{margin-top:10px;font-size:14px;line-height:1.45;color:var(--ink-soft);white-space:pre-wrap;word-break:break-word;font-weight:500}
.comment b{color:var(--ink)}
.applied{flex:none;display:flex;align-items:center;gap:8px;background:transparent;border:2px solid var(--line);border-radius:10px;padding:7px 10px;font-weight:800;font-size:13px}
.applied .box{width:18px;height:18px;border-radius:5px;border:2px solid var(--ink-soft);display:flex;align-items:center;justify-content:center}
.applied.on{border-color:var(--ok);color:var(--ok)}
.applied.on .box{background:var(--ok);border-color:var(--ok)}
.applied.on .box::after{content:"";width:8px;height:4px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.empty{margin-top:30px;color:var(--ink-soft);font-weight:600}
.login{max-width:400px;margin:0 auto;padding:110px 22px}
.login .inp{font-size:19px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;font-size:14px;z-index:20;max-width:90vw}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

/* ============================ HELPERS ============================ */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (n, loc="en-US", d=0) => Number(n).toLocaleString(loc,{minimumFractionDigits:d,maximumFractionDigits:d});
// Power typed in millions. Accepts 231.5 / 231,5 / 231.5M / 231500000 / 231,500,000 / 231.500.000
function parseMil(raw){
  let s = String(raw||"").trim().replace(/\s+/g,"").replace(/[mм]$/i,"");
  if (!s) return null;
  if (!/^[0-9.,]+$/.test(s)) return NaN;
  const seps = (s.match(/[.,]/g)||[]).length;
  const digits = s.replace(/[.,]/g,"");
  if (!digits) return NaN;
  let v;
  if (seps > 1) v = Number(digits) / 1e6;
  else if (seps === 1) { v = Number(s.replace(",", ".")); if (v >= 90000) v = v / 1e6; }
  else { v = Number(digits); if (v >= 90000) v = v / 1e6; }
  if (!isFinite(v)) return NaN;
  return Math.round(v * 10) / 10;
}
function parseInt0(raw, max){
  const s = String(raw||"").trim();
  if (!s) return null;
  if (!/^[0-9.,\s]+$/.test(s)) return NaN;
  const n = Number(s.replace(/[^0-9]/g,""));
  if (!isFinite(n) || n > max) return NaN;
  return n;
}
const TICK = `<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;

/* ============================ RACCOON ============================ */
const PAL = {k:"#2B2B2B",g:"#8C8C8C",d:"#5C5C5C",w:"#F4F4F4"};
const BODY = ["............kk..kk..","...........gggggggg.","..........gkkkgkkkg.","kk........gkwkgkwkgg","kkgg.....ggwwwwwwggk","..kkgg.gggggggggggg.","....kkgggggggggggg..","......gggggggggggg..","......dggggggggggd.."];
const LEGS_A = ["......d.d.....d.d...",".....d...d...d...d.."];
const LEGS_B = [".......dd.....dd....",".......dd.....dd...."];
const pix = (rows, pal, y0=0) => rows.map((r,y) => [...r].map((c,x) => pal[c] ? `<rect x="${x}" y="${y+y0}" width="1" height="1" fill="${pal[c]}"/>` : "").join("")).join("");
const COON_SVG = `<svg viewBox="0 0 20 11" shape-rendering="crispEdges" aria-hidden="true">${pix(BODY,PAL)}<g class="fA">${pix(LEGS_A,PAL,9)}</g><g class="fB">${pix(LEGS_B,PAL,9)}</g></svg>`;
const SAUS_SVG = `<svg viewBox="0 0 10 4" width="32" height="13" shape-rendering="crispEdges" aria-hidden="true">${pix(["..rrrrrr..",".rRRRRRRr.","trRRRRRRrt",".rrrrrrrr."],{r:"#9C3F25",R:"#CF5E37",t:"#C9A27A"})}</svg>`;
const HEART_SVG = `<svg viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true">${pix([".rr.rr.","rwrrrrr","rrrrrrr",".rrrrr.","..rrr..","...r..."],{r:"#E0465A",w:"#FFFFFF"})}</svg>`;

  {id:"nickname", type:"text"},

};
const $app = document.getElementById("app");
const $top = document.getElementById("top");
const L = () => T[S.lang || "en"];

let runTimer = null;
function drawTop(p, finished, showBack){
  if (!$top.querySelector(".track")) {
    $top.className = "top";
    $top.innerHTML = `<div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100">${STEPS.map(() => `<span class="seg"></span>`).join("")}</div>
      <div class="lane"><div class="heart">${HEART_SVG}</div><div class="coon">${COON_SVG}</div><div class="sausage">${SAUS_SVG}</div><div class="nom">nom</div></div>
      <div class="backrow"></div>`;
  }
  $top.style.setProperty("--p", p);
  $top.querySelector(".track").setAttribute("aria-valuenow", Math.round(p*100));
  const doneN = Math.round(p * STEPS.length);
  $top.querySelectorAll(".seg").forEach((el,k) => { el.classList.toggle("done", k < doneN); el.classList.toggle("cur", k === doneN && !finished); });
  const coon = $top.querySelector(".coon");
  coon.classList.add("run"); clearTimeout(runTimer); runTimer = setTimeout(() => coon.classList.remove("run"), 720);
  $top.querySelector(".sausage").classList.toggle("gone", !!finished);
  $top.querySelector(".nom").classList.toggle("on", !!finished);
  $top.querySelector(".heart").classList.toggle("on", !!finished);
  const row = $top.querySelector(".backrow");
  row.innerHTML = showBack ? `<button class="backbtn" id="bk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>${esc(L().back)}</button>` : "";
  const bk = row.querySelector("#bk"); if (bk) bk.onclick = () => go(S.i - 1, -1);
}

function optBtn(attr, val, label, sel, extra=""){
  return `<button class="opt ${sel?"sel":""}" ${attr}="${val}">${extra}${esc(label)}${TICK}</button>`;
}

  const t = L();

  if (st.type === "beef") {
    body = `<div class="opts">${BEEF.map((b,k) => optBtn("data-beef", b, t.beefOpts[k], a.beef===b)).join("")}</div>`;
    if (a.beef === "explain") body += `<div class="field"><textarea class="inp" id="v" data-k="beefNote" maxlength="1000" placeholder="${esc(t.ph.beef)}">${esc(a.beefNote)}</textarea></div>`;
    else showOk = false;
  }
  if (st.type === "textarea") body = `<div class="field"><textarea class="inp" id="v" data-k="comment" maxlength="1000" placeholder="${esc(t.ph.comment)}">${esc(a.comment)}</textarea></div>`;

  const isArea = st.type === "textarea" || st.type === "beef";
  $app.innerHTML = `<main><section class="step ${anim}" id="stp">
    <div class="num">${S.i+1} / ${STEPS.length}</div>
    <h1 id="qh">${esc(t.q[st.id])}</h1>
    ${body}
    <div class="err" id="er" role="alert"></div>
    <div class="actions">
      ${showOk ? `<button class="btn" id="ok">${esc(last ? t.send : t.ok)}</button>` : ""}
      ${st.skip && !last ? `<button class="link" id="sk">${esc(t.skip)}</button>` : ""}
      ${showOk && !isArea ? `<span class="enter">${esc(t.enter)}</span>` : ""}
    </div>
  </section></main>`;
  wire(st);
}

function wire(st){
  const t = L(), a = S.a, loc = LOCALE[S.lang];
  const er = document.getElementById("er");
  const v = document.getElementById("v"), pv = document.getElementById("pv");

  const updPreview = () => {
    if (!pv || !v) return;
    if (st.type === "mil") { const n = parseMil(v.value); pv.textContent = (n != null && !isNaN(n) && n > 0) ? "= " + fmt(n*1e6, loc) : ""; }
    if (st.type === "kills") { const n = parseInt0(v.value, 1e12); pv.textContent = (n != null && !isNaN(n)) ? "= " + fmt(n, loc) : ""; }
  };
  if (v) {
    v.addEventListener("input", () => { a[v.dataset.k] = v.value; er.textContent = ""; updPreview(); });
    v.addEventListener("keydown", e => { if (e.key === "Enter" && (v.tagName !== "TEXTAREA" || e.metaKey || e.ctrlKey)) { e.preventDefault(); next(); } });
    updPreview();
    setTimeout(() => { try { v.focus({preventScroll:true}); } catch(_){} }, 80);
  }

  const sl = document.getElementById("sl");
  if (sl) {
    const cl = document.getElementById("cl");
    const set = () => { a.conf = Number(sl.value); sl.classList.remove("unset"); cl.classList.remove("unset"); cl.textContent = t.conf[a.conf-1]; er.textContent = ""; };
    ["input","change","pointerup"].forEach(ev => sl.addEventListener(ev, set));
    sl.addEventListener("keyup", e => { if (e.key !== "Enter" && e.key !== "Tab") set(); });
    sl.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); next(); } });
  }
  const cs = document.getElementById("cs");
  if (cs) {
    const csl = document.getElementById("csl");
    const set = () => { a.crewSize = Number(cs.value); cs.classList.remove("unset"); csl.classList.remove("unset"); csl.textContent = t.crewSizeVal.replace("{n}", a.crewSize); };
    ["input","change","pointerup"].forEach(ev => cs.addEventListener(ev, set));
  }

  // choice buttons: blink + tick, then move on (or open the extra fields)
  $app.querySelectorAll("[data-seat]").forEach(b => b.onclick = () => { a.seat = b.dataset.seat; pickThen(b, () => go(S.i + 1, 1)); });
  $app.querySelectorAll("[data-crew]").forEach(b => b.onclick = () => {
    if (S.busy) return;
    a.crew = b.dataset.crew;
    if (a.crew === "crew") { S.dir = 0; render(); return; }
    a.crewWord = ""; a.crewSize = null; pickThen(b, () => go(S.i + 1, 1));
  });
  $app.querySelectorAll("[data-rejoin]").forEach(b => b.onclick = () => {
    if (S.busy) return;
    a.rejoin = b.dataset.rejoin;
    if (a.rejoin === "yes") { S.dir = 0; render(); return; }
    a.rejoinWho = ""; pickThen(b, () => go(S.i + 1, 1));
  });
  $app.querySelectorAll("[data-beef]").forEach(b => b.onclick = () => {
    if (S.busy) return;
    a.beef = b.dataset.beef;
    if (a.beef === "explain") { S.dir = 0; render(); return; }
    a.beefNote = ""; pickThen(b, () => go(S.i + 1, 1));
  });

  const ok = document.getElementById("ok"); if (ok) ok.onclick = next;
  const sk = document.getElementById("sk"); if (sk) sk.onclick = () => {
    if (st.id === "beef") { a.beef = null; a.beefNote = ""; } else a[st.id] = "";
    go(S.i + 1, 1);
  };
}

function pickThen(btn, fn){
  if (S.busy) return;
  S.busy = true;
  btn.parentElement.querySelectorAll(".opt").forEach(x => x.classList.toggle("sel", x === btn));
  btn.classList.add("blink");
  setTimeout(() => { S.busy = false; fn(); }, 420);
}

function validate(st){
  const t = L(), a = S.a;
  switch (st.id) {
    case "nickname": return a.nickname.trim() ? null : t.e.req;
    case "server": { const n = parseInt0(a.server, 99999); if (n === null) return null; return (isNaN(n) || n < 1) ? t.e.num : null; }
    case "crew": if (!a.crew) return t.e.req; return (a.crew === "crew" && !a.crewWord.trim()) ? t.e.crewEmpty : null;
    case "rejoin": if (!a.rejoin) return t.e.req; return (a.rejoin === "yes" && !a.rejoinWho.trim()) ? t.e.rejoinEmpty : null;
    case "seat": return a.seat ? null : t.e.req;
    case "total": { const n = parseMil(a.total); if (n === null) return t.e.req; if (isNaN(n)) return t.e.num; return (n < 80 || n > 600) ? t.e.range : null; }
    case "squad": {
      const n = parseMil(a.squad); if (n === null) return t.e.req; if (isNaN(n) || n <= 0) return t.e.num;
      const tot = parseMil(a.total); return (tot != null && !isNaN(tot) && n > tot) ? t.e.squadMax : null;
    }
    case "kills": { const n = parseInt0(a.kills, 1e12); if (n === null) return t.e.req; return isNaN(n) ? t.e.num : null; }
    case "conf": return a.conf == null ? t.e.req : null;
    case "beef": return (a.beef === "explain" && !a.beefNote.trim()) ? t.e.beefEmpty : null;
    default: return null;
  }
}
function showErr(msg){
  const er = document.getElementById("er"), stp = document.getElementById("stp");
  if (!er) return;
  er.className = "err"; er.textContent = msg;
  if (stp) { stp.classList.remove("in","inb","shake"); void stp.offsetWidth; stp.classList.add("shake"); }
}
function next(){
  if (S.sending || S.busy) return;
  const st = STEPS[S.i], err = validate(st);
  if (err) { showErr(err); return; }
  if (S.i === STEPS.length - 1) submit(); else go(S.i + 1, 1);
}
function go(i, dir){
  if (i < -1 || S.busy) return;
  const stp = document.querySelector(".step");
  S.busy = true;
  if (stp) stp.classList.add(dir < 0 ? "outb" : "out");
  setTimeout(() => { S.busy = false; S.i = i; S.dir = dir; render(); window.scrollTo(0, 0); }, stp ? 160 : 0);
}

/* ============================ SAVE ============================ */
function buildData(){
  const a = S.a;
  return {
    nickname: a.nickname.trim().slice(0, 40),
    server: parseInt0(a.server, 99999),
    crew: a.crew === "crew" ? a.crewWord.trim().slice(0, 40) : "",
    crewSize: a.crew === "crew" ? a.crewSize : null,
    rejoin: a.rejoin === "yes" ? a.rejoinWho.trim().slice(0, 80) : "",
    seat: a.seat,
    totalPower: parseMil(a.total),
    squadPower: parseMil(a.squad),
    kills: parseInt0(a.kills, 1e12),
    confidence: a.conf,
    beef: a.beef,
    beefNote: a.beef === "explain" ? a.beefNote.trim().slice(0, 1000) : "",
    comment: a.comment.trim().slice(0, 1000),
    applied: false
  };
}
function saveDraft(id, data){ try { localStorage.setItem(DRAFT_KEY, JSON.stringify({id, data})); } catch(_){} }
function clearDraft(){ try { localStorage.removeItem(DRAFT_KEY); } catch(_){} }

async function submit(){
  const t = L();
  for (let k = 0; k < STEPS.length; k++) {
    const e = validate(STEPS[k]);
    if (e) { S.i = k; S.dir = -1; render(); setTimeout(() => showErr(e), 0); return; }
  }
  const ok = document.getElementById("ok"), er = document.getElementById("er");
  S.sending = true; ok.disabled = true; ok.textContent = t.sending; er.textContent = "";
  if (!S.pending) {
    const data = buildData();
    if (!S.docId) S.docId = doc(collection(db, COL)).id;
    saveDraft(S.docId, data);
    S.pending = setDoc(doc(db, COL, S.docId), {...data, createdAt: serverTimestamp()});
  }
  const weak = setTimeout(() => { if (S.sending) { er.className = "err info"; er.textContent = t.weak; } }, 8000);
  try {
    await S.pending;
    clearTimeout(weak); clearDraft();
    S.sending = false; S.pending = null;
    go(STEPS.length, 1);
  } catch (e) {
    clearTimeout(weak);
    S.sending = false; S.pending = null;
    console.error(e);
    showErr(t.fail + (e && e.code ? ` (${e.code})` : ""));
    ok.disabled = false; ok.textContent = t.retry;
  }
}
// A send cut off by closing the page is resent on the next visit, with the same id (no doubles).
async function flushDraft(){
  let d = null; try { d = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null"); } catch(_){}
  if (!d || !d.id || !d.data) return;
  try { await setDoc(doc(db, COL, d.id), {...d.data, createdAt: serverTimestamp()}); clearDraft(); }
  catch (e) { if (e && e.code === "permission-denied") clearDraft(); }
}

/* ============================ BOARD ============================ */
const CONF_EN = T.en.conf, SEAT_EN = T.en.seats;
const BEEF_EN = {none:"No beef", past:"Beef, left behind", explain:"Has beef"};
let rows = [], unsub = null;

const P = m => m >= 1000 ? fmt(m/1000, "en-US", 2) + "G" : fmt(m, "en-US", 1) + "M";
const pl = n => `${n} player${n===1?"":"s"}`;
const keyOf = s => String(s||"").trim().toLowerCase().replace(/\s+/g," ");
const ms = r => r.createdAt && r.createdAt.toMillis ? r.createdAt.toMillis() : 0;
const isWarm = r => r.confidence === 4 || r.confidence === 5;
function toast(msg){ const el = document.createElement("div"); el.className = "toast"; el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), 2600); }

function analyse(list){
  const newest = new Map();
  list.forEach(r => { const k = keyOf(r.nickname); const c = newest.get(k); if (!c || ms(r) > ms(c)) newest.set(k, r); });
  const out = list.map(r => ({...r, dupe: newest.get(keyOf(r.nickname)).id !== r.id}));
  const live = out.filter(r => !r.dupe);
  const sorter = (x, y) => (y.confidence||0) - (x.confidence||0) || (y.squadPower||0) - (x.squadPower||0) || ms(y) - ms(x);
  const groups = SEATS.map(s => ({seat:s, items: out.filter(r => r.seat === s).sort((x,y) => (x.dupe - y.dupe) || sorter(x,y))}));
  const sum = arr => Math.round(arr.reduce((t, r) => t + (r.totalPower||0), 0) * 10) / 10;
  const warm = live.filter(isWarm), cold = live.filter(r => !isWarm(r));
  const totals = {
    all:{n:live.length, p:sum(live)}, warm:{n:warm.length, p:sum(warm)}, cold:{n:cold.length, p:sum(cold)},
    seat:Object.fromEntries(SEATS.map(s => { const x = live.filter(r => r.seat === s); return [s, {n:x.length, p:sum(x)}]; }))
  };
  const cm = new Map();
  live.filter(r => r.crew).forEach(r => {
    const k = keyOf(r.crew);
    if (!cm.has(k)) cm.set(k, {name:r.crew.trim(), forms:0, applied:0, size:null, p:0});
    const c = cm.get(k);
    c.forms++; if (r.applied) c.applied++; c.p += r.totalPower||0;
    if (r.crewSize != null) c.size = Math.max(c.size || 0, r.crewSize);
  });
  const crews = [...cm.values()].map(c => ({...c, p:Math.round(c.p*10)/10})).sort((x,y) => y.forms - x.forms || x.name.localeCompare(y.name));
  return {groups, totals, crews, dupes: out.length - live.length};
}

function boardLogin(msg){
  $top.innerHTML = ""; $top.className = "";
  $app.innerHTML = `<div class="login"><h1>Transfer board</h1><p class="hint">Leaders only.</p>
    <input class="inp" id="em" type="email" autocomplete="username" placeholder="Login email">
    <input class="inp" id="pw" type="password" autocomplete="current-password" placeholder="Password">
    <div class="err" id="er">${esc(msg||"")}</div>
    <div class="actions"><button class="btn" id="li">Log in</button></div></div>`;
  const doLogin = async () => {
    const b = document.getElementById("li"); b.disabled = true;
    try { await signInWithEmailAndPassword(auth, document.getElementById("em").value.trim(), document.getElementById("pw").value); }
    catch (e) { document.getElementById("er").textContent = "Login failed. Check email and password."; b.disabled = false; }
  };
  document.getElementById("li").onclick = doLogin;
  document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
}

function renderBoard(){
  const {groups, totals, crews, dupes} = analyse(rows);
  const tr = (label, x, sw) => `<div class="trow"><span>${sw ? `<span class="sw ${sw}"></span>` : ""}${label}</span><b>${pl(x.n)}, ${P(x.p)}</b></div>`;
  const crewRow = c => `<div class="trow"><span>${esc(c.name)}</span><b>${c.size ? `${c.applied}/${c.size}` : c.applied} applied, ${c.forms} form${c.forms===1?"":"s"}, ${P(c.p)}</b></div>`;
  $app.innerHTML = `<div class="board">
    <div class="bhead"><div><h1>Transfer board</h1><div class="bsub">${rows.length} application${rows.length===1?"":"s"}${dupes ? `, ${dupes} duplicate${dupes>1?"s":""} (not counted)` : ""}</div></div>
      <div class="bbtns"><button class="bbtn" id="csv">Export CSV</button><button class="bbtn ghost" id="lo">Log out</button></div></div>
    <div class="tgrid">
      <div class="totals"><h2>Power by confidence</h2>${tr("Confident (4–5)", totals.warm)}${tr("Hesitating (1–3)", totals.cold)}${tr("All", totals.all)}</div>
      <div class="totals"><h2>Power by seat</h2>${SEATS.map(s => tr(SEAT_EN[s], totals.seat[s], s)).join("")}</div>
    </div>
    ${crews.length ? `<div class="totals crews"><h2>Crews</h2>${crews.map(crewRow).join("")}</div>` : ""}
    ${rows.length === 0 ? `<p class="empty">No applications yet. Share the form link to get the first ones in.</p>` : ""}
    ${groups.filter(g => g.items.length).map(g => `<section class="group">
      <div class="ghead"><span class="sw ${g.seat}"></span>${SEAT_EN[g.seat]} <small>${pl(g.items.filter(r => !r.dupe).length)}</small></div>
      ${g.items.map(r => `<div class="card ${r.dupe?"dupe":""}">
        <div class="ctop"><div><div class="cname">${esc(r.nickname)}</div>
          <div class="badges">
            ${r.server != null ? `<span class="badge">Server ${esc(r.server)}</span>` : ""}
            <span class="badge ${isWarm(r)?"warm":""}">${r.confidence ? `${r.confidence}/5 ${esc(CONF_EN[r.confidence-1])}` : "Confidence –"}</span>
            ${r.crew ? `<span class="badge">Crew: ${esc(r.crew)}${r.crewSize ? ` (~${esc(r.crewSize)})` : ""}</span>` : `<span class="badge">Solo</span>`}
            ${r.rejoin ? `<span class="badge">Rejoining: ${esc(r.rejoin)}</span>` : ""}
            ${r.beef ? `<span class="badge ${r.beef==="explain"?"red":""}">${BEEF_EN[r.beef]}</span>` : ""}
            ${r.dupe ? `<span class="badge red">Duplicate, older entry</span>` : ""}
          </div></div>
          <button class="applied ${r.applied?"on":""}" data-id="${esc(r.id)}" data-v="${r.applied?1:0}" aria-pressed="${r.applied?"true":"false"}"><span class="box"></span>Applied</button>
        </div>
        <div class="stats">
          <div class="stat"><small>Total power</small><b>${r.totalPower != null ? P(r.totalPower) : "–"}</b></div>
          <div class="stat"><small>1st squad</small><b>${r.squadPower != null ? P(r.squadPower) : "–"}</b></div>
          <div class="stat"><small>Kills</small><b>${r.kills != null ? fmt(r.kills) : "–"}</b></div>
        </div>
        ${r.beefNote ? `<div class="comment"><b>Beef:</b> ${esc(r.beefNote)}</div>` : ""}
        ${r.comment ? `<div class="comment">${esc(r.comment)}</div>` : ""}
      </div>`).join("")}
    </section>`).join("")}
  </div>`;
  document.getElementById("lo").onclick = () => signOut(auth);
  document.getElementById("csv").onclick = exportCsv;
  $app.querySelectorAll(".applied").forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await updateDoc(doc(db, COL, b.dataset.id), {applied: b.dataset.v !== "1"}); }
    catch (e) { console.error(e); toast("Couldn't save the tick. Check your connection and try again."); b.disabled = false; }
  });
}

function csvCell(v){ const s = v == null ? "" : String(v); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; }
async function exportCsv(){
  const {groups, totals, crews} = analyse(rows);
  const now = new Date(), stamp = now.toISOString().slice(0,16).replace("T"," ");
  const R = [];
  R.push(["Transfer to 1053 export", stamp], []);
  R.push(["Totals (duplicates not counted)","Players","Total hero power (M)"]);
  R.push(["Confident (4-5)", totals.warm.n, totals.warm.p]);
  R.push(["Hesitating (1-3)", totals.cold.n, totals.cold.p]);
  SEATS.forEach(s => R.push([SEAT_EN[s] + " seats", totals.seat[s].n, totals.seat[s].p]));
  R.push(["All", totals.all.n, totals.all.p], []);
  if (crews.length) {
    R.push(["Crew","Applied","Crew size (stated)","Forms","Total hero power (M)"]);
    crews.forEach(c => R.push([c.name, c.applied, c.size ?? "", c.forms, c.p]));
    R.push([]);
  }
  R.push(["Nickname","Server","Seat","Total hero power (M)","1st squad power (M)","Kills","Confidence (1-5)","Confident or hesitating","Crew","Crew size","Rejoining","Applied","Duplicate","Beef","Beef details","Comment","Submitted (UTC)"]);
  groups.forEach(g => g.items.forEach(r => R.push([
    r.nickname, r.server ?? "", SEAT_EN[r.seat], r.totalPower ?? "", r.squadPower ?? "", r.kills ?? "",
    r.confidence ?? "", isWarm(r) ? "Confident" : "Hesitating", r.crew || "Solo", r.crewSize ?? "", r.rejoin || "",
    r.applied ? "Yes" : "No", r.dupe ? "Yes" : "No", r.beef ? BEEF_EN[r.beef] : "", r.beefNote || "", r.comment || "",
    ms(r) ? new Date(ms(r)).toISOString().slice(0,16).replace("T"," ") : ""
  ])));
  const text = "﻿" + R.map(r => r.map(csvCell).join(",")).join("\r\n");
  const name = `transfer-1053-${now.toISOString().slice(0,10)}.csv`;
  const file = new File([text], name, {type:"text/csv"});
  try { if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:name}); return; } }
  catch (e) { if (e && e.name === "AbortError") return; }
  const url = URL.createObjectURL(file);
  const link = document.createElement("a"); link.href = url; link.download = name; document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function startBoard(){
  document.title = "Transfer board";
  onAuthStateChanged(auth, user => {
    if (unsub) { unsub(); unsub = null; }
    if (!user) { boardLogin(); return; }
    $app.innerHTML = `<div class="board"><p class="empty">Loading…</p></div>`;
    unsub = onSnapshot(collection(db, COL),
      snap => { rows = snap.docs.map(d => ({id:d.id, ...d.data()})); renderBoard(); },
      err => { console.error(err); if (err.code === "permission-denied") { signOut(auth); boardLogin("This login has no access to the board."); } else toast("Connection issue. Data will refresh when you're back online."); });
  });
}

/* ============================ START ============================ */
if (location.hash === "#board") startBoard();
else { render(); flushDraft(); }
window.addEventListener("hashchange", () => location.reload());
